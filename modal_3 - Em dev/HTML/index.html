<!DOCTYPE html>
<html>

<head>
    <title>Seletor Flexpro</title>
    <link rel="stylesheet" href="../CSS/padroes.css">
    <link rel="stylesheet" href="../CSS/style.css">
    <link rel="stylesheet" href="../CSS/temas.css">
</head>

<body>
    <div id="background">
    </div>
    <div id="menu" class="black_box">
        <h1 id="titulo_modal">Menu</h1>
        <button id="abrir_simob" class="botao_abrir">Abrir Simob</button>
        <button id="abrir_tarefas" class="botao_abrir">Abrir Tarefas</button>
        <button id="abrir_temas" class="botao_abrir">Personalizar Tema</button>
    </div>

    <div id="simob_modal" class="black_box">
        <div id="conteudo_simob" class="white_box">
            <h1 id="titulo_simob">Selecione a base:</h1>
            <button id="fechar_simob" class="botao_fechar">X</button>
            <div id="posicao_botoes">
                <button id="botao_adm" class="botao_abrir">Abrir ADM</button>
                <button id="botao_demo" class="botao_abrir">Abrir Demonstração</button>
                <button id="botao_habiteto" class="botao_abrir">Abrir Habiteto</button>
                <button id="botao_simob" class="botao_abrir">Abrir Simob</button>
                <button id="botao_base_propria" class="botao_abrir">Outra Base</button>
            </div>
        </div>
    </div>

    <div id="temas_modal" class="black_box">

        <div id="conteudo_temas" class="white_box">
            <h1 id="titulo_temas">Selecione suas cores:</h1>
            <button id="fechar_temas" class="botao_fechar">X</button>

            <div id="opcoes_cores">
                <label for="cor_fundo">Cor de Fundo:</label>
                <input type="color" id="cor_fundo">
                <label for="cor_fechar">Cor de Botões Fechar:</label>
                <input type="color" id="cor_fechar">
                <label for="cor_destaque">Cor de Destaque:</label>
                <input type="color" id="cor_destaque">
                <button id="restaurar_tema_padrao" class="botao_abrir">Restaurar Cores Padrão</button>
            </div>

        </div>

    </div>

    <div id="tarefas_modal" class="black_box">

        <div id="conteudo_tarefas" class="white_box">
            <h1 id="titulo_tarefas">Tarefas</h1>
            <button id="fechar_tarefas" class="botao_fechar">X</button>

            <div id="lista_tarefas">
                <div class="coluna_tarefas">
                    <button id="expandir_tarefas_abertas" class="botao_expandir">Tarefas Abertas ▼</button>
                    <div id="tarefas_abertas" class="conteudo_expandido">
                        <div class="cabecalho_tarefas">
                            <span>Título</span>
                            <span>Prioridade</span>
                            <span>Status</span>
                            <span>Ações</span>
                        </div>
                        <div class="linha_tarefa">
                            <span>Tarefa aberta 1</span>
                            <span>Média</span>
                            <span>Nova</span>
                            <div class="acoes_tarefa">
                                <button class="botao_editar">✎</button>
                                <button class="botao_excluir">🗑</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="coluna_tarefas">
                    <button id="expandir_tarefas_concluidas" class="botao_expandir">Tarefas Concluídas ▼</button>
                    <div id="tarefas_concluidas" class="conteudo_expandido">
                        <p>Tarefa teste 3</p>
                        <p>Tarefa teste 4</p>
                    </div>
                </div>
            </div>

            <button id="nova_tarefa" class="botao_abrir">Nova Tarefa +</button>
        </div>
    </div>

    <div id="cadastro_tarefa_modal" class="black_box">
        <div id="conteudo_cadastro_tarefa" class="white_box">
            <h1 id="titulo_cadastro_tarefa">Nova Tarefa</h1>
            <button id="fechar_cadastro_tarefa" class="botao_fechar">X</button>
            <label for="nome_tarefa">Título da tarefa</label>
            <input type="text" id="nome_tarefa">
            <label for="prioridade_tarefa">Prioridade</label>
            <select id="prioridade_tarefa">
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
                <option value="urgente">Urgente</option>
            </select>
            <button id="nova_nota" class="botao_abrir">+ Adicionar Nota</button>
            <button id="cancelar_nota" class="botao_cancelar">- Cancelar Nota</button>
            <textarea id="nota_tarefa"></textarea>
            <button id="finalizar_cadastro_tarefa" class="botao_abrir">Cadastrar Tarefa</button>
        </div>
    </div>

    <div id="tarefa_cadastrada_modal" class="black_box">
        <div id="tarefa_cadastrada_conteudo" class="white_box">
            <h1 id="editar_tarefa_texto">Editar Tarefa</h1>
            <button id="fechar_tarefa_cadastrada" class="botao_fechar">X</button>
            <div id="area_edicao_tarefa">
                <div id="informacoes_tarefa_divisoria">
                    <h1>Informações da Tarefa</h1>
                    <label for="nome_tarefa_edicao">Título da tarefa</label>
                    <input type="text" id="nome_tarefa_edicao">
                    <label for="prioridade_tarefa_edicao">Prioridade</label>
                    <select id="prioridade_tarefa_edicao">
                        <option value="baixa">Baixa</option>
                        <option value="media">Média</option>
                        <option value="alta">Alta</option>
                        <option value="urgente">Urgente</option>
                    </select>
                    <label for="status_tarefa_edicao">Status</label>
                    <select id="status_tarefa_edicao">
                        <option value="nova">Nova</option>
                        <option value="executando">Executando</option>
                        <option value="finalizado">Finalizado</option>
                        <option value="cancelado">Cancelado</option>
                    </select>
                    <p id="data_criacao_tarefa">Data da tarefa: </p>

                    <button id="salvar_edicao_tarefa" class="botao_abrir">Salvar</button>
                </div>
                <div id="notas_divisoria">
                    <h1>Notas</h1>
                    <button id="cancelar_nota_edicao" class="botao_abrir">Histórico de notas</button>
                    <button id="nova_nota_edicao" class="botao_abrir">+ Adicionar Nota</button>
                    <textarea id="nota_tarefa_edicao"></textarea>
                    <button id="salvar_nota_edicao" class="botao_abrir">Salvar Nota</button>
                </div>
            </div>
        </div>
    </div>

</body>

<script src="../JS/elementos.js"></script>
<script src="../JS/script.js"></script>

</html>
